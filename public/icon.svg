<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c423d" />
      <stop offset="100%" stop-color="#1b2a27" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="40" y1="35" x2="140" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdf4df" />
      <stop offset="45%" stop-color="#e8ca92" />
      <stop offset="100%" stop-color="#c49a56" />
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="180" height="180" rx="42" fill="url(#bgGrad)" />

  <!-- Subtle inner gold border -->
  <rect x="7" y="7" width="166" height="166" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.45" />

  <!-- Delicate corner sparkles -->
  <path d="M42 38L43.8 45.2L51 47L43.8 48.8L42 56L40.2 48.8L33 47L40.2 45.2Z" fill="url(#goldGrad)" opacity="0.85" />
  <path d="M140 126L141.4 131.6L147 133L141.4 134.4L140 140L138.6 134.4L133 133L138.6 131.6Z" fill="url(#goldGrad)" opacity="0.7" />

  <!-- Elegant Monogram M -->
  <g transform="translate(0, 4)">
    <text
      x="90"
      y="114"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="94"
      font-weight="400"
      font-style="italic"
      fill="url(#goldGrad)"
      letter-spacing="-1"
    >
      M
    </text>

    <!-- Small decorative botanical / crown dots -->
    <circle cx="90" cy="132" r="2.8" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="81" cy="132" r="1.6" fill="url(#goldGrad)" opacity="0.6" />
    <circle cx="99" cy="132" r="1.6" fill="url(#goldGrad)" opacity="0.6" />
  </g>
</svg>